<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Сила</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Сила">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eceef3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07090c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>/* Layout: one screen per tab (Тренировка, История, Прогресс, Питание, Ещё), floating tab bar, floating rest timer, bottom sheets.
   Material rule: real glass (blur) only on the layer that floats over content — tab bar, timer, sheets, toast, workout header.
   Content sits on matte translucent slabs so numbers stay readable in the gym. The ambient glow behind everything takes the colour of the training day. */
@property --glow { syntax: "<color>"; inherits: true; initial-value: #ff4a5e; }
@property --glow2 { syntax: "<color>"; inherits: true; initial-value: #3d6bff; }

:root {
  --bg: #eceef3;
  --surface: #ffffff;
  --surface2: #e8ebf0;
  --ink: #0f1217;
  --muted: #626a76;
  --line: rgba(15, 18, 23, .09);
  --accent: #d7263d;
  --accent-soft: rgba(215, 38, 61, .10);
  --good: #1f9d55; --good-soft: rgba(31, 157, 85, .12);
  --warn: #9a5f00; --warn-soft: rgba(194, 124, 14, .15);
  --z1: #d7263d; --z2: #2f6fd6; --z3: #2e9b5f;

  --card: rgba(255, 255, 255, .78);
  --rim: rgba(255, 255, 255, .95);
  --fill: rgba(15, 18, 23, .055);
  --fill2: rgba(15, 18, 23, .11);
  --glass: rgba(255, 255, 255, .58);
  --glass-thick: rgba(246, 247, 250, .86);
  --glass-brd: rgba(255, 255, 255, .7);
  --glass-hi: rgba(255, 255, 255, .95);
  --glass-lo: rgba(255, 255, 255, .4);
  --bubble: rgba(255, 255, 255, .9); --bubble-tab: rgba(255, 255, 255, .92);
  --bubble-shadow: 0 1px 5px rgba(15, 18, 23, .14);
  --card-shadow: 0 1px 1px rgba(15, 18, 23, .04), 0 10px 28px rgba(15, 18, 23, .06);
  --float-shadow: 0 14px 38px rgba(15, 18, 23, .16), 0 2px 6px rgba(15, 18, 23, .08);
  --glow: #ff4a5e; --glow2: #3d6bff;
  --glow-a: 16%; --glow-b: 12%; --glow-c: 9%;

  --tab-h: 64px;
  --tab-b: max(10px, calc(env(safe-area-inset-bottom) - 14px));
  --spring: cubic-bezier(.34, 1.42, .44, 1);
  --out: cubic-bezier(.22, 1, .36, 1);
  --num: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Helvetica Neue", sans-serif;
  --body: -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07090c; --surface: #171a20; --surface2: #22262e; --ink: #f3f5f8; --muted: #8e97a4; --line: rgba(255, 255, 255, .08);
    --accent: #ff4a5e; --accent-soft: rgba(255, 74, 94, .16);
    --good: #3fcf7f; --good-soft: rgba(63, 207, 127, .14);
    --warn: #f0a93a; --warn-soft: rgba(240, 169, 58, .15);
    --z1: #ff4a5e; --z2: #6ea2ff; --z3: #4fc285;
    --card: rgba(255, 255, 255, .055); --rim: rgba(255, 255, 255, .07);
    --fill: rgba(255, 255, 255, .08); --fill2: rgba(255, 255, 255, .15);
    --glass: rgba(30, 33, 40, .62); --glass-thick: rgba(22, 25, 31, .82);
    --glass-brd: rgba(255, 255, 255, .1); --glass-hi: rgba(255, 255, 255, .22); --glass-lo: rgba(255, 255, 255, .05);
    --bubble: rgba(255, 255, 255, .13); --bubble-tab: rgba(64, 68, 80, .78); --bubble-shadow: 0 2px 10px rgba(0, 0, 0, .28);
    --card-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
    --float-shadow: 0 16px 44px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .35);
    --glow-a: 24%; --glow-b: 15%; --glow-c: 12%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07090c; --surface: #171a20; --surface2: #22262e; --ink: #f3f5f8; --muted: #8e97a4; --line: rgba(255, 255, 255, .08);
  --accent: #ff4a5e; --accent-soft: rgba(255, 74, 94, .16);
  --good: #3fcf7f; --good-soft: rgba(63, 207, 127, .14);
  --warn: #f0a93a; --warn-soft: rgba(240, 169, 58, .15);
  --z1: #ff4a5e; --z2: #6ea2ff; --z3: #4fc285;
  --card: rgba(255, 255, 255, .055); --rim: rgba(255, 255, 255, .07);
  --fill: rgba(255, 255, 255, .08); --fill2: rgba(255, 255, 255, .15);
  --glass: rgba(30, 33, 40, .62); --glass-thick: rgba(22, 25, 31, .82);
  --glass-brd: rgba(255, 255, 255, .1); --glass-hi: rgba(255, 255, 255, .22); --glass-lo: rgba(255, 255, 255, .05);
  --bubble: rgba(255, 255, 255, .13); --bubble-tab: rgba(64, 68, 80, .78); --bubble-shadow: 0 2px 10px rgba(0, 0, 0, .28);
  --card-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
  --float-shadow: 0 16px 44px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .35);
  --glow-a: 24%; --glow-b: 15%; --glow-c: 12%;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { margin: 0; background: var(--bg); overscroll-behavior: none; }
body { margin: 0; background: transparent; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; }
body { padding: calc(env(safe-area-inset-top) + 10px) 0 calc(var(--tab-b) + var(--tab-h) + 28px); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: --glow 1s ease, --glow2 1s ease; }
body.has-timer { padding-bottom: calc(var(--tab-b) + var(--tab-h) + 116px); }
/* ambient glow: the colour the glass picks up */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(95% 55% at -5% -5%, color-mix(in srgb, var(--glow) var(--glow-a), transparent), transparent 70%),
    radial-gradient(85% 50% at 112% 42%, color-mix(in srgb, var(--glow2) var(--glow-b), transparent), transparent 70%),
    radial-gradient(95% 45% at 5% 108%, color-mix(in srgb, var(--glow) var(--glow-c), transparent), transparent 70%); }
body[data-tone="B"] { --glow: #4f8cff; --glow2: #9a6bff; }
body[data-tone="C"] { --glow: #2fc27a; --glow2: #1fa3c7; }
#app { overflow-x: clip; }

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; transition: transform .22s var(--out), background-color .2s, color .2s, opacity .2s; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea, select { font: inherit; color: var(--ink); -webkit-user-select: text; user-select: text; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 600px; margin: 0 auto; padding: 0 14px; display: grid; gap: 14px; }

/* press feedback: everything tappable gives a little */
.btn:active, .chip:active, button.pill:active, .icon-btn:active, .mv:active, .rm-step:active, .rm-btn:active, .back:active, .set .ok:active, .set .rpe:active, .set .no:active,
.stepper button:active, .presets button:active, .rpe-grid button:active, .plate-chips button:active, .calc-big:active, .sheet-x:active, .timer .ctrls button:active { transform: scale(.94); }

/* header */
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.head h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -.025em; line-height: 1.08; text-wrap: balance; }
.head .sub { font-size: 14px; color: var(--muted); margin-top: 3px; }
.back { display: inline-flex; align-items: center; gap: 2px; height: 40px; padding: 0 16px 0 9px; border-radius: 999px; background: var(--card); border: 1px solid var(--rim); box-shadow: var(--card-shadow); color: var(--ink); font-weight: 600; font-size: 15px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); border: 1px solid var(--rim); box-shadow: var(--card-shadow); display: grid; place-items: center; flex: none; }
.icon-btn svg, .ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* cards & generic */
.card { background: var(--card); border: 1px solid var(--rim); border-radius: 26px; box-shadow: var(--card-shadow); padding: 16px; display: grid; gap: 12px; }
.card.flat { padding: 0; overflow: hidden; gap: 0; }
.label { font-size: 13px; color: var(--muted); font-weight: 650; letter-spacing: -.005em; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn { min-height: 48px; border-radius: 24px; font-weight: 700; font-size: 16px; line-height: 1.2; text-align: center; background: var(--fill); box-shadow: inset 0 1px 0 var(--glass-lo); padding: 6px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:disabled { opacity: .38; box-shadow: none; }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 86%, #fff), var(--accent)); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 8px 20px color-mix(in srgb, var(--accent) 32%, transparent); }
.btn.good { background: linear-gradient(180deg, color-mix(in srgb, var(--good) 86%, #fff), var(--good)); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 8px 20px color-mix(in srgb, var(--good) 30%, transparent); }
.btn.ghost { background: transparent; box-shadow: none; color: var(--accent); }
.btn.danger { background: transparent; box-shadow: none; color: var(--accent); }
.btn.sm { min-height: 36px; border-radius: 18px; font-size: 14px; padding: 4px 14px; }
.btn.sm.primary, .btn.sm.good { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
.btn.block { width: 100%; }
.btns { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -14px; padding: 2px 14px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 9px 15px; border-radius: 999px; background: var(--card); border: 1px solid var(--rim); box-shadow: var(--card-shadow); font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: transparent; color: var(--bg); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--fill); color: var(--muted); white-space: nowrap; }
.pill.up { background: var(--good-soft); color: var(--good); }
.pill.down { background: var(--accent-soft); color: var(--accent); }
.pill.hold { background: var(--fill); color: var(--muted); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.pr { background: var(--warn-soft); color: var(--warn); }
.seg { display: flex; background: var(--fill); border-radius: 999px; padding: 3px; }
.seg button { flex: 1; padding: 8px 10px; border-radius: 999px; font-weight: 650; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--bubble); color: var(--ink); box-shadow: var(--bubble-shadow), inset 0 1px 0 var(--glass-hi); }
.list-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); text-align: left; }
.list-row:last-child { border-bottom: 0; }
button.list-row:active { background: var(--fill); }
.list-row .grow { flex: 1; min-width: 0; }
.list-row b { display: block; font-weight: 600; }
.list-row small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { color: var(--muted); flex: none; }
.empty { color: var(--muted); font-size: 15px; text-align: center; padding: 24px 10px; }
.note { font-size: 13px; color: var(--muted); }
.warnbox { background: var(--warn-soft); color: var(--ink); border-radius: 20px; padding: 12px 14px; font-size: 14px; }

/* start screen */
.next-day { display: grid; gap: 12px; }
.next-day h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.plan-line { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; align-items: center; }
.plan-line:last-child { border-bottom: 0; }
.plan-line .r { font-family: var(--num); font-weight: 700; text-align: right; white-space: nowrap; }
.plan-line small { display: block; color: var(--muted); font-size: 12px; }
.ss-mark { display: inline-block; width: 18px; height: 18px; border-radius: 6px; background: var(--z2); color: #fff; font-size: 11px; font-weight: 800; text-align: center; line-height: 18px; margin-right: 6px; vertical-align: 1px; }

/* workout */
.wo-head { position: sticky; top: 0; z-index: 4; padding: calc(env(safe-area-inset-top) + 8px) 0 10px; margin-top: calc(-1 * (env(safe-area-inset-top) + 10px)); }
/* content blurs away under the header instead of meeting a hard bar */
.wo-head::before { content: ""; position: absolute; inset: 0 0 -20px; z-index: -1; pointer-events: none; background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 78%, transparent) 50%, transparent); -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%); -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent); mask-image: linear-gradient(to bottom, #000 60%, transparent); }
.wo-head .wrap { gap: 2px; }
.wo-head .icon-btn { background: var(--fill); }
.wo-time { font-family: var(--num); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.ex-card { background: var(--card); border: 1px solid var(--rim); border-radius: 26px; box-shadow: var(--card-shadow); overflow: hidden; }
.ex-card.ss { box-shadow: inset 3px 0 0 var(--z2), var(--card-shadow); }
.ex-top { padding: 14px 14px 10px; display: grid; gap: 9px; }
.ex-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.ex-title h3 { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }
.ex-title .ssl { font-size: 12px; font-weight: 700; color: var(--z2); }
.rm-strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rm-step { height: 40px; min-width: 46px; padding: 0 12px; border-radius: 999px; background: var(--fill); font-family: var(--num); font-weight: 800; font-size: 15px; color: var(--accent); }
.rm-btn { display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 14px; border-radius: 999px; background: var(--accent-soft); }
.rm-btn span { font-size: 12px; font-weight: 800; color: var(--accent); letter-spacing: .03em; }
.rm-btn b { font-family: var(--num); font-size: 20px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.rm-btn i { font-style: normal; font-size: 12px; color: var(--muted); }
.rm-edit { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rm-edit input { width: 104px; height: 40px; border-radius: 14px; border: 2px solid var(--accent); background: var(--surface); text-align: center; font-family: var(--num); font-size: 18px; font-weight: 800; }
.prev-line { font-size: 13px; color: var(--muted); }
.prev-line b { color: var(--ink); font-weight: 600; }
.rec { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 16px; background: var(--fill); font-size: 14px; }
.rec .pill { flex: none; margin-top: 1px; }
.target { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.target .pill { cursor: pointer; }
.sets { border-top: 1px solid var(--line); }
.set-h, .set { display: grid; grid-template-columns: 30px minmax(0, 1fr) 72px 52px 50px 40px; gap: 6px; align-items: center; padding: 6px 10px 6px 12px; }
.set-h { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: 9px; padding-bottom: 2px; }
.set-h span:nth-child(n+3) { text-align: center; }
.set { border-top: 1px solid transparent; }
.set.done { background: var(--good-soft); }
.set .no { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-family: var(--num); font-weight: 800; font-size: 14px; background: var(--fill); }
.set .no.w { color: var(--warn); background: var(--warn-soft); }
.set .no.t { color: #fff; background: var(--accent); }
.set .prev { font-family: var(--num); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set input { width: 100%; height: 40px; border-radius: 13px; border: 1px solid transparent; background: var(--fill); text-align: center; font-family: var(--num); font-size: 17px; font-weight: 700; padding: 0 2px; transition: background-color .2s, border-color .2s; }
.set input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.set input::placeholder { color: var(--muted); opacity: .75; font-weight: 600; }
.set.done input { background: transparent; }
.set .rpe { height: 40px; border-radius: 13px; background: var(--fill); font-family: var(--num); font-weight: 700; font-size: 15px; }
.set .rpe.ph { color: var(--muted); font-weight: 600; font-size: 13px; }
.set.done .rpe { background: transparent; }
.set .ok { width: 40px; height: 40px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--muted); justify-self: end; }
.set.done .ok { background: var(--good); color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--good) 40%, transparent), inset 0 1px 0 rgba(255, 255, 255, .35); }
.set .ok svg { width: 20px; height: 20px; }
.set-meta { grid-column: 2 / -1; font-size: 12px; color: var(--muted); padding: 0 0 4px; display: flex; gap: 8px; flex-wrap: wrap; }
.set-meta .pill { padding: 1px 7px; font-size: 11px; }
.ex-foot { display: flex; gap: 8px; padding: 8px 12px 14px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); padding: 0 12px 6px 50px; }
.hint button { color: var(--accent); font-weight: 700; font-size: 12px; }
.ex-note { width: 100%; border: 1px solid var(--line); background: var(--fill); border-radius: 14px; padding: 9px 12px; font-size: 15px; resize: none; min-height: 40px; }

/* floating glass: tab bar, timer, toast */
.toast { background: var(--glass-thick); }
.tabs, .timer { background: var(--glass); }
.tabs, .timer, .toast { border: 1px solid var(--glass-brd); -webkit-backdrop-filter: blur(24px) saturate(190%); backdrop-filter: blur(24px) saturate(190%); box-shadow: var(--float-shadow), inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo); }
/* specular rim: brighter where light would catch the edge */
.tabs::before, .timer::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; background: linear-gradient(135deg, var(--glass-hi), transparent 30%, transparent 68%, var(--glass-hi)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); opacity: .7; }

/* timer: the glass fills with colour as the rest runs out */
.timer { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tab-b) + var(--tab-h) + 10px); z-index: 8; max-width: 520px; margin: 0 auto; border-radius: 30px; padding: 12px 12px 12px 20px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; overflow: hidden; isolation: isolate; animation: timer-in .55s var(--spring); }
.timer.swap { animation: timer-ready .9s var(--out); }
.timer.out { animation: timer-out .26s ease-in forwards; }
.timer .fill { position: absolute; inset: 0; z-index: -1; }
.timer .fill i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 12%, transparent), color-mix(in srgb, var(--accent) 34%, transparent)); box-shadow: 1px 0 0 color-mix(in srgb, var(--accent) 55%, transparent); transition: width .5s linear; }
.timer.done { background: color-mix(in srgb, var(--good) 72%, transparent); color: #fff; }
.timer.done .fill i { background: transparent; box-shadow: none; }
.timer .tm-main { text-align: left; color: inherit; min-width: 0; }
.timer .t { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 32px; font-weight: 800; line-height: 1; letter-spacing: -.01em; }
.timer .lbl { font-size: 12px; opacity: .72; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer .ctrls { display: flex; gap: 6px; }
.timer .ctrls button { height: 42px; min-width: 46px; padding: 0 12px; border-radius: 999px; background: var(--fill2); font-weight: 700; font-size: 14px; color: inherit; box-shadow: inset 0 1px 0 var(--glass-lo); }
.timer.done .ctrls button { background: rgba(255, 255, 255, .25); }

/* tab bar */
.tabs-fade { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tab-b) + var(--tab-h) + 30px); z-index: 6; pointer-events: none; background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--bg) 78%, transparent) 50%, color-mix(in srgb, var(--bg) 94%, transparent)); }
.tabs { position: fixed; left: 14px; right: 14px; bottom: var(--tab-b); z-index: 7; max-width: 520px; height: var(--tab-h); margin: 0 auto; padding: 5px; border-radius: 999px; display: grid; grid-template-columns: repeat(5, 1fr); isolation: isolate; }
.tabs .ind { position: absolute; z-index: -1; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 5); border-radius: 999px; background: var(--bubble-tab); box-shadow: var(--bubble-shadow), inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .5s var(--spring); }
.tabs button { position: relative; display: grid; align-content: center; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--muted); border-radius: 999px; transition: color .25s, transform .25s var(--out); }
.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; transition: transform .45s var(--spring); }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs button[aria-current="page"] svg { transform: scale(1.1); }
.tabs button:active { transform: scale(.9); }
.tabs .live { position: absolute; top: 8px; left: calc(50% + 8px); width: 9px; height: 9px; border-radius: 50%; background: var(--accent); opacity: 0; transform: scale(0); transition: transform .4s var(--spring), opacity .2s; }
.tabs.has-live .live { opacity: 1; transform: none; animation: live 2s ease-in-out infinite; }

/* toast */
.toast { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 16px; right: 16px; z-index: 40; width: fit-content; max-width: min(calc(100% - 32px), 440px); margin: 0 auto; padding: 11px 18px; border-radius: 22px; color: var(--ink); font-weight: 600; font-size: 14px; text-align: center; pointer-events: none; opacity: 0; transform: translateY(-18px) scale(.92); transition: transform .5s var(--spring), opacity .25s; }
.toast.show { opacity: 1; transform: none; }

/* history */
.hist-item { width: 100%; text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.hist-item:last-child { border-bottom: 0; }
.hist-item:active { background: var(--fill); }
.hist-item .t1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
.hist-item .t2 { font-size: 13px; color: var(--muted); }
.day-badge { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; font-size: 13px; font-weight: 800; color: #fff; margin-right: 8px; }
.day-A { background: var(--z1); } .day-B { background: var(--z2); } .day-C { background: var(--z3); } .day-X { background: var(--muted); }
.detail-ex { padding: 10px 0; border-bottom: 1px solid var(--line); }
.detail-ex:last-child { border-bottom: 0; }
.detail-ex h4 { margin: 0 0 4px; font-size: 16px; }
.detail-ex .s { font-family: var(--num); font-size: 14px; color: var(--ink); display: flex; gap: 8px; }
.detail-ex .s.w { color: var(--muted); }

/* progress */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--fill); border-radius: 18px; padding: 12px; }
.stat b { display: block; font-family: var(--num); font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.stat span { font-size: 12px; color: var(--muted); }
.mus { display: grid; grid-template-columns: 112px 1fr 44px; gap: 8px; align-items: center; font-size: 14px; padding: 3px 0; }
.mus .trk { position: relative; height: 10px; border-radius: 5px; background: var(--fill); }
.mus .trk .band { position: absolute; top: 0; bottom: 0; background: var(--good-soft); border-left: 1px solid var(--good); border-right: 1px solid var(--good); }
.mus .trk .val { position: absolute; top: 2px; bottom: 2px; left: 0; border-radius: 3px; background: var(--z2); }
.mus .n { font-family: var(--num); font-weight: 700; text-align: right; }
.spark { width: 84px; height: 28px; flex: none; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart.lc { touch-action: pan-y; -webkit-user-select: none; user-select: none; cursor: crosshair; }
.chart.lc .lc-tip { pointer-events: none; }
.rec-table { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rec-cell { background: var(--fill); border-radius: 16px; padding: 9px 12px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.rec-cell b { display: block; font-family: var(--num); font-size: 16px; color: var(--ink); }

/* calculator */
.calc-top { padding: 16px; display: grid; gap: 12px; border-bottom: 1px solid var(--line); }
.calc-rm { display: grid; grid-template-columns: 58px 1fr 58px; align-items: center; gap: 8px; }
.calc-rm .rm-step { width: 58px; height: 58px; min-width: 0; padding: 0; border-radius: 50%; font-size: 19px; box-shadow: inset 0 1px 0 var(--glass-lo); }
.calc-big { grid-column: 2; display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 4px 0; font-family: var(--num); color: var(--accent); border-radius: 18px; }
.calc-big b { display: inline-block; font-size: 48px; font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.calc-big span { font-size: 17px; font-weight: 700; color: var(--muted); }
.calc-src { text-align: center; text-wrap: balance; }
.calc-row { width: 100%; display: grid; grid-template-columns: 46px 1fr 86px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--line); text-align: left; position: relative; }
.calc-row:last-child { border-bottom: 0; }
.calc-row:active { background: var(--fill); }
.calc-row .rep { font-family: var(--num); font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 9px; }
.calc-row .rep::before { content: ""; width: 4px; height: 22px; border-radius: 2px; background: var(--zc); }
.z1 { --zc: var(--z1); } .z2 { --zc: var(--z2); } .z3 { --zc: var(--z3); }
.calc-row .w b { font-family: var(--num); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.calc-row .w i { font-style: normal; font-size: 12px; color: var(--muted); margin-left: 3px; }
.calc-row .w small { font-family: var(--num); font-size: 12px; color: var(--muted); margin-left: 6px; }
.calc-row .pc { display: grid; grid-template-columns: 1fr 34px; gap: 6px; align-items: center; }
.calc-row .trk { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.calc-row .trk i { display: block; height: 100%; background: var(--zc); opacity: .6; border-radius: 3px; }
.calc-row em { font-style: normal; font-family: var(--num); font-size: 12px; color: var(--muted); text-align: right; }
.calc-row.anchor { background: var(--accent-soft); }
.calc-row.dim { opacity: .42; }
.calc-ed { padding: 14px 16px; background: var(--fill); border-bottom: 1px solid var(--line); display: grid; gap: 10px; }

/* food */
.food-sum { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; }
.ring { width: 112px; height: 112px; position: relative; }
.ring svg { width: 112px; height: 112px; transform: rotate(-90deg); overflow: visible; }
.ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .c b { display: block; font-family: var(--num); font-size: 24px; font-weight: 800; line-height: 1; }
.ring .c span { font-size: 11px; color: var(--muted); }
.macro { display: grid; gap: 7px; }
.macro .m { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.macro .m .trk { height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; }
.macro .m .trk i { display: block; height: 100%; border-radius: 4px; }
.macro .m em { font-style: normal; font-family: var(--num); font-weight: 700; font-size: 13px; white-space: nowrap; }
.food-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); }
.food-row:last-child { border-bottom: 0; }
.food-row.on { background: var(--good-soft); }
.food-row .nm { text-align: left; min-width: 0; }
.food-row .nm b { display: block; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.food-row .nm small { display: block; font-family: var(--num); font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 38px; height: 38px; border-radius: 50%; background: var(--fill); font-size: 20px; font-weight: 700; }
.stepper input { width: 46px; height: 38px; text-align: center; border: 0; border-radius: 12px; background: transparent; font-family: var(--num); font-size: 17px; font-weight: 800; }
.search { width: 100%; height: 44px; border-radius: 999px; border: 1px solid var(--rim); background: var(--card); padding: 0 18px; font-size: 16px; }
.search:focus { outline: none; border-color: var(--accent); }
.log-row { display: grid; grid-template-columns: 64px repeat(5, 1fr) 28px; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-family: var(--num); font-size: 13px; align-items: center; }
.log-row.h { font-family: var(--body); font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.log-row span { text-align: right; }
.log-row span:first-child { text-align: left; }
.log-row .bad { color: var(--accent); }
.log-row .ok { color: var(--good); }

/* sheet: thick glass, inset from the screen edges */
.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .36); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 20; }
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 21; max-width: 600px; max-height: calc(100% - 56px); margin: 0 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; border-radius: 36px; padding: 10px 18px max(18px, calc(env(safe-area-inset-bottom) + 2px));
  background: var(--glass-thick); border: 1px solid var(--glass-brd); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); box-shadow: var(--float-shadow), inset 0 1px 0 var(--glass-hi);
  transform: translateY(calc(100% + 30px)); transition: transform .28s cubic-bezier(.4, 0, 1, 1); }
.sheet.open { transform: none; transition: transform .52s cubic-bezier(.3, 1.22, .4, 1); }
.sheet-x { position: absolute; right: 14px; top: 12px; width: 36px; height: 36px; border-radius: 50%; background: var(--fill2); color: var(--muted); font-size: 15px; font-weight: 700; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--fill2); margin: 0 auto 14px; }
.sheet h2 { margin: 0 0 14px; padding-right: 44px; font-size: 22px; font-weight: 800; letter-spacing: -.015em; text-wrap: balance; }
.sheet .stack { display: grid; gap: 10px; }
.field { display: grid; gap: 5px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.field input, .field select, .field textarea { height: 48px; border-radius: 15px; border: 1px solid transparent; background: var(--fill); padding: 0 14px; font-size: 17px; width: 100%; transition: border-color .2s, background-color .2s; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.field textarea { height: 140px; padding: 10px 12px; font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.grid5 .field input { padding: 0 6px; text-align: center; font-size: 16px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
.toggle b { display: block; font-size: 15px; font-weight: 600; }
.toggle small { color: var(--muted); font-size: 13px; }
.switch { flex: none; width: 60px; height: 30px; border-radius: 999px; background: var(--fill2); position: relative; transition: background-color .25s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 36px; height: 26px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .28); transition: transform .4s var(--spring); }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.rpe-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.rpe-grid button { height: 58px; border-radius: 20px; background: var(--fill); font-family: var(--num); font-size: 20px; font-weight: 800; display: grid; place-items: center; align-content: center; line-height: 1.05; }
.rpe-grid button small { font-family: var(--body); font-size: 10px; font-weight: 600; color: var(--muted); }
.rpe-grid button[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 6px 16px color-mix(in srgb, var(--accent) 32%, transparent); }
.rpe-grid button[aria-pressed="true"] small { color: rgba(255, 255, 255, .8); }
.opt { width: 100%; display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); text-align: left; }
.opt:last-child { border-bottom: 0; }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--fill2); transition: border .25s var(--out); }
.opt[aria-pressed="true"] .radio { border: 7px solid var(--accent); }
.opt b { display: block; font-size: 16px; }
.opt small { display: block; font-size: 13px; color: var(--muted); }
.opt .mini { font-family: var(--num); font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.presets button { height: 50px; border-radius: 999px; background: var(--fill); font-family: var(--num); font-size: 17px; font-weight: 800; }
.presets button[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }

/* plates */
.plate-wrap { display: grid; gap: 12px; }
.plate-big { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.plate-big b { font-family: var(--num); font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
.plate-big span { font-size: 15px; font-weight: 700; color: var(--muted); text-align: right; }
.plate-big span.bad { color: var(--accent); }
.plate-svg { width: 100%; height: 150px; display: block; background: var(--fill); border-radius: 22px; }
.plate-chips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.plate-chips button { height: 44px; border-radius: 999px; font-family: var(--num); font-weight: 800; font-size: 15px; background: var(--fill); color: var(--muted); text-decoration: line-through; }
.plate-chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); text-decoration: none; }
.per-side { font-size: 15px; }
.per-side b { font-family: var(--num); }
.pl-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pl-steps .btn { font-family: var(--num); font-weight: 800; padding: 0; white-space: nowrap; }

/* workout summary */
.sum-done { position: relative; overflow: hidden; background: linear-gradient(135deg, color-mix(in srgb, var(--good) 84%, #fff), var(--good)); border-color: transparent; color: #fff; box-shadow: 0 14px 34px color-mix(in srgb, var(--good) 32%, transparent), inset 0 1px 0 rgba(255, 255, 255, .4); }
.sum-done .label { color: #fff; }
.rec-line { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.rec-line:last-child { border-bottom: 0; }
.rec-line .pill { flex: none; min-width: 72px; justify-content: center; }
.rec-line b { display: block; font-size: 15px; }
.rec-line small { display: block; font-size: 13px; color: var(--muted); font-family: var(--num); }
.sum-sets { display: grid; gap: 2px; }
.sum-set { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 13px; font-family: var(--num); font-size: 15px; }
.sum-set .no { color: var(--muted); font-weight: 800; font-size: 13px; }
.sum-set.w { color: var(--muted); font-size: 13px; padding-top: 2px; padding-bottom: 2px; }
.sum-set.best { background: var(--accent-soft); }
.sum-set .r { display: flex; gap: 6px; align-items: center; justify-content: flex-end; font-size: 13px; }
.chart-ctrls { display: grid; gap: 8px; }
.ch-val { font-family: var(--num); font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -.01em; }
.ch-sub { font-size: 13px; color: var(--muted); }

.mv { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); color: var(--ink); font-weight: 800; font-size: 15px; display: grid; place-items: center; flex: none; }
.mv:disabled { opacity: .3; }
.mv svg { width: 18px; height: 18px; }
.prog-row { gap: 6px; }
.prog-row .grow b { display: block; font-weight: 600; }
.prog-row .grow small { display: block; color: var(--muted); font-size: 13px; }
.grip-cfg { display: grid; gap: 6px; padding: 12px; border-radius: 18px; background: var(--fill); }
.gchips { display: flex; gap: 6px; flex-wrap: wrap; }
.gchips .chip { padding: 6px 12px; box-shadow: none; border-color: transparent; background: var(--fill); }
.gchips .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ============ motion ============ */
/* Keyframes only describe where things come from; the resting state is always the normal style, so with motion off nothing stays hidden. */
/* screens: tabs rise, deeper pages push in from the right and pop back to the left */
@keyframes v-rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes v-push { from { opacity: 0; transform: translateX(30px); } }
@keyframes v-pop { from { opacity: 0; transform: translateX(-30px); } }
#app.enter-tab > * { animation: v-rise .36s var(--out); }
#app.enter-push > * { animation: v-push .42s var(--out); }
#app.enter-pop > * { animation: v-pop .42s var(--out); }

/* data draws itself in once, when its screen opens */
@keyframes draw { from { stroke-dasharray: 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1; stroke-dashoffset: 0; } }
@keyframes draw-check { from { stroke-dasharray: 20; stroke-dashoffset: 20; } to { stroke-dasharray: 20; stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes dot-in { from { opacity: 0; transform: scale(0); } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes grow-y { from { transform: scaleY(0); } }
@keyframes ring-in { from { stroke-dasharray: 0 302; } }
.enter .lc-line { animation: draw 1s .12s var(--out) backwards; }
.enter .lc-area, .enter .lc-glow { animation: fade .7s .55s backwards; }
.enter .lc-dot { transform-box: fill-box; transform-origin: center; animation: dot-in .4s calc(.12s + var(--k, 0) * .7s) var(--spring) backwards; }
.enter .lc-last { animation: fade .4s .9s backwards; }
.enter .spark path { animation: draw .9s .1s var(--out) backwards; }
.enter .spark circle { animation: fade .3s .8s backwards; }
.enter .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow-y .6s calc(.05s + var(--k, 0) * 22ms) var(--out) backwards; }
.enter .mus .val, .enter .calc-row .trk i, .enter .macro .trk i { transform-origin: 0 50%; animation: grow-x .75s .12s var(--out) backwards; }
.enter .ring-val { animation: ring-in 1.1s .1s var(--out) backwards; }

/* a number that just changed rolls in from the direction it moved */
@keyframes tick-up { from { opacity: 0; transform: translateY(45%); filter: blur(3px); } }
@keyframes tick-down { from { opacity: 0; transform: translateY(-45%); filter: blur(3px); } }
.calc-big.tick-up b, b.tick-up { display: inline-block; animation: tick-up .34s var(--out); }
.calc-big.tick-down b, b.tick-down { display: inline-block; animation: tick-down .34s var(--out); }

/* a finished set: the row lights up, the check draws itself */
@keyframes set-flash { from { background: color-mix(in srgb, var(--good) 42%, transparent); } }
@keyframes ok-pop { 0% { transform: scale(.55); } 55% { transform: scale(1.16); } }
@keyframes pr-pop { 0% { opacity: 0; transform: scale(.4) rotate(-8deg); } 60% { transform: scale(1.18) rotate(2deg); } }
.set.just { animation: set-flash .9s var(--out); }
.set.just .ok { animation: ok-pop .5s var(--out); }
.set.just .ok path { animation: draw-check .32s .14s var(--out) backwards; }
.set.just + .set .pill.pr { animation: pr-pop .7s .2s var(--out) backwards; }

/* timer */
@keyframes timer-in { from { opacity: 0; transform: translateY(26px) scale(.9); } }
@keyframes timer-out { to { opacity: 0; transform: translateY(20px) scale(.94); } }
@keyframes timer-ready { 0% { transform: scale(.96); } 30% { transform: scale(1.03); box-shadow: var(--float-shadow), 0 0 0 10px color-mix(in srgb, var(--good) 28%, transparent); } }
@keyframes live { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }

/* saved workout: one sweep of light across the card */
@keyframes done-in { from { opacity: 0; transform: scale(.9); } }
.enter .sum-done { animation: done-in .6s var(--spring) backwards; }
.enter .sum-done::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; pointer-events: none; opacity: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .38), transparent); animation: sheen 1.1s .45s var(--out); }
@keyframes sheen { 0% { opacity: 1; transform: translateX(-130%) skewX(-18deg); } 100% { opacity: 1; transform: translateX(260%) skewX(-18deg); } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
@media (prefers-reduced-transparency: reduce) {
  .tabs, .timer, .toast, .sheet { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--surface); }
  .wo-head::before { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--bg); -webkit-mask-image: none; mask-image: none; }
}

.live-note { color: var(--accent); font-weight: 700; }

/* ---------- web app: restore code, wide screens (unfolded iPhone Duo, landscape) ---------- */
.code-big { font-size: 24px; font-weight: 800; letter-spacing: .06em; text-align: center; padding: 18px 10px; border-radius: 20px; background: var(--fill); -webkit-user-select: text; user-select: text; }

/* status column on the right edge (iPhone Duo): content stays clear of it, background runs under it */
:root { --col: 0px; --sar: max(env(safe-area-inset-right, 0px), var(--col)); --sal: env(safe-area-inset-left, 0px); }
#app { padding-right: var(--sar); padding-left: var(--sal); }
.tabs { left: calc(14px + var(--sal)); right: calc(14px + var(--sar)); }
.timer { left: calc(12px + var(--sal)); right: calc(12px + var(--sar)); }

@media (prefers-color-scheme: light) { html.has-col .colshade { display: block; } }

/* ---------- wide screens: unfolded iPhone Duo in landscape ---------- */
@media (min-width: 700px) {

  .wrap { max-width: 720px; padding: 0 18px 0 6px; }
  .wrap:has(> .pane), .wrap.wo-list { max-width: 1120px; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; align-items: start; }

  .tabs .ind { top: 5px; bottom: auto; left: 5px; right: 5px; width: auto; height: calc((100% - 10px) / 5); border-radius: 34px; transform: translateY(calc(var(--i, 0) * 100%)); }
  .tabs button { border-radius: 34px; font-size: 10px; }
  .timer { left: calc(var(--rail) + var(--sal) + 12px); bottom: 16px; max-width: 560px; }
  .toast { left: calc(var(--rail) + var(--sal) + 16px); }
  .sheet { left: calc(var(--rail) + var(--sal) + 8px); max-width: 620px; bottom: 16px; }
}
@media (min-width: 700px) { #foodSum .btns .btn { white-space: nowrap; padding-left: 10px; padding-right: 10px; font-size: 15px; } }

<body>
<main id="app"></main>
<div id="timer"></div>
<div id="nav"></div>
<div class="colshade" aria-hidden="true"></div>
<div id="toast" class="toast" role="status"></div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<script>/* «Сила» — home-screen web app layer: storage, offline, push timer, automatic backups. */
(function () {
"use strict";
var KEY = "sila-app-v2", CFGK = "sila-web", DEF_SERVER = "https://sila.ivanov-filipp.workers.dev";
var IS_TEST = !!window.__TEST__;
function dflt() { return { server: DEF_SERVER.indexOf("__") === 0 ? "" : DEF_SERVER, code: "", vapid: "", push: false, wake: true, fill: true, last: null, lastErr: null, lastExport: null, suspect: null, force: false }; }
var cfg = dflt();
try { cfg = Object.assign(dflt(), JSON.parse(localStorage.getItem(CFGK) || "{}")); } catch (e) {}
function saveCfg() { var t = JSON.stringify(cfg); try { localStorage.setItem(CFGK, t); } catch (e) {} idbPut("cfg", t); }
function ui() { return window.__ui; }
function toast(t) { if (ui()) ui().toast(t); }
function rerender() { if (ui()) ui().render(); }
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function standalone() { return !!(window.navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)); }
function ago(ts) {
  if (!ts) return "никогда";
  var m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "только что"; if (m < 60) return m + " мин назад";
  var h = Math.round(m / 60); if (h < 24) return h + " ч назад";
  var d = Math.round(h / 24); return d + " дн. назад";
}
function hm(ts) { var d = new Date(ts); return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); }
function plural(n, a, b, c) { var m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; }

/* ---------- IndexedDB mirror (second copy on the phone, also read by the service worker) ---------- */
var dbp = null;
function db() {
  if (!dbp) dbp = new Promise(function (res, rej) {
    if (!window.indexedDB) return rej(new Error("no idb"));
    var r = indexedDB.open("sila", 1);
    r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
    r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
  });
  return dbp;
}
function idbPut(k, v) { return db().then(function (d) { return new Promise(function (res) { var t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = res; t.onabort = res; }); }).catch(function () {}); }
function idbGet(k) { return db().then(function (d) { return new Promise(function (res) { var t = d.transaction("kv", "readonly"), q = t.objectStore("kv").get(k); q.onsuccess = function () { res(q.result); }; q.onerror = function () { res(null); }; }); }).catch(function () { return null; }); }

/* ---------- server ---------- */
function connected() { return !!(cfg.server && cfg.code); }
function api(path, body, ms) {
  var ctl = window.AbortController ? new AbortController() : null, tm = ctl ? setTimeout(function () { ctl.abort(); }, ms || 10000) : null;
  return fetch(cfg.server + path, { method: body ? "POST" : "GET", headers: { Authorization: "Bearer " + cfg.code, "Content-Type": "text/plain;charset=UTF-8" }, body: body ? JSON.stringify(body) : undefined, signal: ctl ? ctl.signal : undefined, cache: "no-store" })
    .then(function (r) { return r.json().catch(function () { return { ok: false, error: "HTTP " + r.status }; }).then(function (j) { j.status = r.status; return j; }); })
    .finally(function () { if (tm) clearTimeout(tm); });
}
function newCode() {
  var al = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b = crypto.getRandomValues(new Uint8Array(16)), s = "";
  for (var i = 0; i < 16; i++) { s += al[b[i] % al.length]; if (i % 4 === 3 && i < 15) s += "-"; }
  return s;
}
function normUrl(u) { u = String(u || "").trim(); if (!u) return ""; if (!/^https?:\/\//i.test(u)) u = "https://" + u; return u.replace(/\/+$/, ""); }
function unb64u(s) { s = String(s).replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var b = atob(s), o = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }

var bkT = null, bkDirty = false, bkBusy = false, lastBkSent = 0, finished = false, netWarned = false;
function scheduleBackup() {
  if (!connected()) return;
  bkDirty = true; clearTimeout(bkT);
  var S = ui() && ui().getS(), active = S && S.active;
  var delay = finished ? 800 : active ? Math.max(20000, 300000 - (Date.now() - lastBkSent)) : 8000;
  bkT = setTimeout(doBackup, delay);
}
function doBackup() {
  if (!connected() || bkBusy) return Promise.resolve();
  var data = null; try { data = localStorage.getItem(KEY); } catch (e) {}
  if (!data) return Promise.resolve();
  bkBusy = true; bkDirty = false; finished = false; lastBkSent = Date.now();
  return api("/backup", { data: data, day: ui().today(), ver: ui().version, force: cfg.force || undefined }, 45000).then(function (r) {
    if (r.ok && r.suspect) { cfg.suspect = { best: r.best, here: r.workouts, t: Date.now() }; saveCfg(); rerender(); }
    else if (r.ok) { cfg.last = { ts: r.ts || Date.now(), w: r.workouts }; cfg.lastErr = null; cfg.force = false; if (cfg.suspect) { cfg.suspect = null; } saveCfg(); }
    else { cfg.lastErr = { ts: Date.now(), e: r.error || "ошибка" }; saveCfg(); }
  }).catch(function () { cfg.lastErr = { ts: Date.now(), e: "нет связи" }; saveCfg(); bkDirty = true; })
    .finally(function () { bkBusy = false; });
}

/* ---------- bridge from the app ---------- */
function bridge(cmd, data, S) {
  if (cmd === "save") {
    try {
      var j = JSON.stringify(S); idbPut("state", j);
      var okLs = false; try { okLs = localStorage.getItem(KEY) === j; } catch (e) {}
      try { if (okLs) localStorage.removeItem("sila-ls-stale"); else localStorage.setItem("sila-ls-stale", "1"); } catch (e) {}
    } catch (e) {}
    scheduleBackup(); return;
  }
  if (cmd === "finished") { finished = true; return; }
  if (cmd === "notify") {
    idbPut("timer", JSON.stringify(data));
    if (connected() && cfg.push) api("/timer", { at: data.at, title: data.title, body: data.body, id: String(data.at) }, 8000).then(function (r) { if (r && r.ok) netWarned = false; else warnNet(); }).catch(warnNet);
    return;
  }
  if (cmd === "cancel") { idbPut("timer", null); if (connected() && cfg.push) api("/cancel", {}, 8000).catch(function () {}); return; }
  if (cmd === "backup") { exportFile(); return; }
}
function warnNet() { if (netWarned) return; netWarned = true; toast("Нет связи с сервером — сигнал отдыха будет только в приложении"); }

/* ---------- files ---------- */
function exportFile() {
  var S = ui().getS(), name = "Сила-копия-" + ui().today() + ".json", text = JSON.stringify(S);
  var asciiName = "Sila-backup-" + ui().today() + ".json";
  var done = function () { cfg.lastExport = Date.now(); saveCfg(); rerender(); };
  var file = null; try { file = new File([text], name, { type: "application/json" }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).then(function () { done(); toast("Копия сохранена"); }).catch(function (e) { if (!e || e.name !== "AbortError") download(text, asciiName, done); });
  } else download(text, asciiName, done);
}
function download(text, name, done) {
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000); done(); toast("Файл копии скачан");
}
function pickFile() {
  var inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json,text/plain"; inp.style.display = "none";
  inp.onchange = function () {
    var f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { previewImport(String(rd.result || ""), "файле «" + f.name + "»", false); };
    rd.onerror = function () { toast("Не удалось прочитать файл"); };
    rd.readAsText(f);
  };
  document.body.appendChild(inp); inp.click();
}
function summary(o) {
  var ws = (o.workouts || []).slice().sort(function (a, b) { return a.d < b.d ? -1 : 1; }), last = ws[ws.length - 1];
  return { w: ws.length, f: ((o.food || {}).log || []).length, ex: Object.keys(o.ex || {}).length, body: (o.body || []).length, last: last ? last.d : null, active: !!o.active };
}
var pending = null;
function previewImport(text, where, fromServer) {
  var o; try { o = JSON.parse(text); } catch (e) { toast("Это не копия «Силы»: текст не читается"); return; }
  if (!ui().valid(o)) { toast("В " + where + " нет данных приложения"); return; }
  pending = { o: o, fromServer: fromServer };
  var a = summary(o), b = summary(ui().getS()), row = function (t, x, y) { return '<div class="row-between"><span>' + t + '</span><span class="num"><b>' + x + '</b> <span class="muted">сейчас ' + y + "</span></span></div>"; };
  ui().openSheet('<h2>Загрузить данные?</h2><div class="stack"><div class="note">Что в ' + esc(where) + ":</div>" +
    row("Тренировки", a.w, b.w) + row("Последняя тренировка", a.last ? ui().dShort(a.last) : "—", b.last ? ui().dShort(b.last) : "—") + row("Дни питания", a.f, b.f) + row("Упражнения", a.ex, b.ex) + row("Замеры тела", a.body, b.body) +
    (a.active ? '<div class="note">В копии есть незавершённая тренировка — она тоже загрузится.</div>' : "") +
    (a.w < b.w ? '<div class="warnbox">В копии меньше тренировок, чем сейчас в приложении.</div>' : "") +
    '<button class="btn primary block" data-act="web" data-w="importGo">Заменить данные</button><button class="btn block" data-act="closeSheet">Отмена</button></div>');
}
function importGo() {
  if (!pending) return;
  var o = pending.o, n = summary(o);
  ui().closeSheet(); ui().setS(o); pending = null;
  cfg.suspect = null; cfg.force = true; saveCfg();
  setTimeout(function () {
    var c = summary(ui().getS());
    toast(c.w === n.w && c.f === n.f ? "Загружено и проверено: " + c.w + " " + plural(c.w, "тренировка", "тренировки", "тренировок") + ", " + c.f + " дн. питания" : "Внимание: загрузилось не всё — напиши Claude");
    if (connected()) doBackup();
  }, 600);
}

/* ---------- server setup ---------- */
function connectSheet(err, u0, c0) {
  ui().openSheet('<h2>Подключить сервер</h2><div class="stack"><div class="note">Сервер — твой бесплатный Cloudflare Worker. Он присылает сигнал конца отдыха на заблокированный экран и хранит копии данных за 30 дней.</div>' +
    '<div class="field"><label for="srvUrl">Адрес сервера</label><input id="srvUrl" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://sila.имя.workers.dev" value="' + esc(u0 != null ? u0 : cfg.server) + '"></div>' +
    '<div class="field"><label for="srvCode">Код восстановления</label><input id="srvCode" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Пусто — создам новый" value="' + esc(c0 != null ? c0 : cfg.code) + '"></div>' +
    '<div class="note" style="color:var(--accent)" id="srvErr">' + esc(err || "") + '</div><button class="btn primary block" data-act="web" data-w="connectGo">Подключить</button></div>');
}
function connectGo() {
  var u = normUrl(document.getElementById("srvUrl").value), code = String(document.getElementById("srvCode").value || "").trim().toUpperCase();
  var e = document.getElementById("srvErr"), btn = document.querySelector('[data-w="connectGo"]');
  if (!u) { e.textContent = "Введи адрес сервера."; return; }
  if (code && code.replace(/-/g, "").length < 12) { e.textContent = "Код слишком короткий — проверь его."; return; }
  if (btn) btn.textContent = "Проверяю…"; e.textContent = "";
  var old = { server: cfg.server, code: cfg.code };
  fetch(u + "/info", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (info) {
    if (!info || info.app !== "sila") throw new Error("По этому адресу не сервер «Силы».");
    if (info.claimed && !code) throw new Error("Сервер уже подключён к другому телефону или к старой установке. Введи свой код восстановления.");
    cfg.server = u; cfg.code = code || newCode(); cfg.vapid = info.vapid;
    return api("/claim", {}).then(function (r) {
      if (!r.ok) throw new Error(r.status === 403 ? "Код не подходит к этому серверу." : "Сервер ответил ошибкой: " + (r.error || r.status));
      saveCfg();
      if (r.fresh) { rerender(); codeSheet(true); doBackup().then(rerender); return; }
      return api("/backups").then(function (b) {
        var lt = (b.list || []).filter(function (x) { return x.slot === "latest"; })[0], here = summary(ui().getS()).w;
        if (lt && lt.workouts > here) { restoreSheet(b.list, "На сервере " + lt.workouts + " " + plural(lt.workouts, "тренировка", "тренировки", "тренировок") + ", в приложении " + here + ". Восстанови последнюю копию."); }
        else { ui().closeSheet(); toast("Сервер подключён"); rerender(); doBackup().then(rerender); }
      });
    });
  }).catch(function (x) {
    cfg.server = old.server; cfg.code = old.code;
    var m = x && x.name === "TypeError" ? "Не удалось связаться с сервером. Проверь адрес и интернет." : (x && x.message) || "Ошибка";
    connectSheet(m, u, code);
  });
}
function codeSheet(fresh) {
  ui().openSheet('<h2>' + (fresh ? "Запиши код восстановления" : "Код восстановления") + '</h2><div class="stack"><div class="code-big num">' + esc(cfg.code) + '</div>' +
    '<div class="note">Сохрани его в «Заметках» или «Паролях». С этим кодом все данные можно вернуть с сервера, даже если удалить иконку или сменить телефон. Без кода сервер чужого не пустит — и тебя тоже.</div>' +
    '<button class="btn primary block" data-act="web" data-w="codeCopy">Скопировать код</button><button class="btn block" data-act="closeSheet">Готово</button></div>');
}
function pushOn() {
  if (!standalone()) { toast("Сигнал работает только в приложении с экрана «Домой»"); return; }
  if (!("Notification" in window) || !navigator.serviceWorker || !window.PushManager) { toast("Эта версия iOS не поддерживает уведомления веб-приложений"); return; }
  if (!cfg.vapid) { toast("Сначала подключи сервер"); return; }
  Notification.requestPermission().then(function (p) {
    if (p !== "granted") throw new Error("Уведомления запрещены. Включи: Настройки → Уведомления → Сила.");
    return navigator.serviceWorker.ready;
  }).then(function (reg) {
    return reg.pushManager.getSubscription().then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(cfg.vapid) }); });
  }).then(function (sub) { return api("/sub", { sub: sub.toJSON() }); }).then(function (r) {
    if (!r.ok) throw new Error("Сервер не принял подписку: " + (r.error || r.status));
    cfg.push = true; saveCfg(); rerender(); toast("Сигнал включён. Проверь: «Проверить сигнал»");
  }).catch(function (e) { toast(e && e.message ? e.message : "Не удалось включить сигнал"); });
}
function restoreSheet(list, lead) {
  var lbl = function (x) { return x.slot === "latest" ? "Последняя копия" : x.slot === "suspect" ? "Отложенная (с короткой историей)" : "Конец дня " + ui().dShort(x.day); };
  var h = '<h2>Восстановить с сервера</h2><div class="stack">' + (lead ? '<div class="warnbox">' + esc(lead) + "</div>" : "");
  if (!list.length) h += '<div class="empty">На сервере пока нет копий</div>';
  list.forEach(function (x) { h += '<button class="list-row" data-act="web" data-w="restoreSlot" data-slot="' + esc(x.slot) + '"><div class="grow"><b>' + esc(lbl(x)) + "</b><small>" + hm(x.ts) + " · " + x.workouts + " " + plural(x.workouts, "тренировка", "тренировки", "тренировок") + " · " + x.food + " дн. питания</small></div></button>"; });
  ui().openSheet(h + "</div>");
}
function restoreList() {
  if (!connected()) { connectSheet(); return; }
  toast("Загружаю список копий…");
  api("/backups").then(function (r) { if (!r.ok) throw new Error(r.error); restoreSheet(r.list || [], cfg.suspect ? "Последняя автокопия из приложения содержала меньше тренировок, чем на сервере, поэтому сервер её отложил." : ""); })
    .catch(function () { toast("Нет связи с сервером"); });
}
function restoreSlot(slot) {
  toast("Загружаю копию…");
  api("/backup?slot=" + encodeURIComponent(slot), null, 45000).then(function (r) { if (!r.ok) throw new Error(r.error); previewImport(r.data, "копии с сервера", true); })
    .catch(function () { toast("Не удалось загрузить копию"); });
}

/* ---------- UI blocks rendered inside the app ---------- */
function cardHtml() {
  var h = '<section class="card"><div class="label">Сервер: сигнал отдыха и автокопии</div>';
  if (!connected()) {
    h += '<div class="note">Не подключён. Без сервера таймер звучит только при открытом приложении, а копии нужно сохранять вручную.</div><button class="btn primary block" data-act="web" data-w="connect">Подключить сервер</button>';
